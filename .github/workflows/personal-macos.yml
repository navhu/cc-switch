name: Personal macOS Build

on:
  workflow_dispatch:
  push:
    branches: [local/grok-seq]

permissions:
  contents: read

jobs:
  build-macos-intel:
    name: Build macOS x86_64 (unsigned personal)
    runs-on: macos-14
    timeout-minutes: 120
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Read pinned Rust toolchain
        id: rust-toolchain
        shell: bash
        run: |
          channel=$(sed -nE 's/^channel *= *"([^"]+)".*/\1/p' rust-toolchain.toml)
          test -n "$channel"
          echo "channel=$channel" >> "$GITHUB_OUTPUT"

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ steps.rust-toolchain.outputs.channel }}
          targets: x86_64-apple-darwin

      - name: Setup pnpm
        env:
          COREPACK_ENABLE_DOWNLOAD_PROMPT: "0"
        run: |
          corepack enable
          corepack install
          pnpm --version

      - name: Install frontend deps
        run: pnpm install --frozen-lockfile

      - name: Build Tauri app (x86_64, no updater artifacts)
        run: |
          pnpm tauri build --target x86_64-apple-darwin -c '{"bundle":{"createUpdaterArtifacts":false}}'

      - name: Package artifact
        shell: bash
        run: |
          set -euo pipefail
          VERSION="personal-$(git rev-parse --short HEAD)"
          mkdir -p release-assets
          APP=""
          for d in \
            "src-tauri/target/x86_64-apple-darwin/release/bundle/macos" \
            "src-tauri/target/release/bundle/macos"
          do
            if [ -d "$d" ]; then
              candidate=$(find "$d" -maxdepth 1 -name '*.app' | head -1 || true)
              if [ -n "$candidate" ]; then APP="$candidate"; break; fi
            fi
          done
          if [ -z "$APP" ]; then
            echo "No .app found"; find src-tauri/target -name '*.app' -maxdepth 6 2>/dev/null | head
            exit 1
          fi
          echo "Found APP=$APP"
          ditto "$APP" "release-assets/CC Switch.app"
          (
            cd release-assets
            zip -ry "CC-Switch-${VERSION}-macOS-x86_64-unsigned.zip" "CC Switch.app"
          )
          ls -lh release-assets/

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: cc-switch-macos-x86_64-unsigned
          path: release-assets/CC-Switch-*-macOS-x86_64-unsigned.zip
          if-no-files-found: error
          retention-days: 14
